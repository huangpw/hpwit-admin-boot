server:
  port: 8606

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境请通过环境变量注入数据库连接信息，避免在仓库留痕
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/zyxhit_admin_boot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true&allowMultiQueries=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:please-change-me}

  data:
    redis:
      database: 0
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          max-active: 16
          max-wait: -1
          max-idle: 16
          min-idle: 4

  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@example.com}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: none
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境不开 SQL 打印
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000           # 30 天
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

oss:
  type: ${OSS_TYPE:minio}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:zyxhit-admin}
    custom-domain: ${MINIO_CUSTOM_DOMAIN:}
  aliyun:
    endpoint: ${ALI_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALI_OSS_AK:}
    access-key-secret: ${ALI_OSS_SK:}
    bucket-name: ${ALI_OSS_BUCKET:zyxhit-admin}
  local:
    storage-path: ${OSS_LOCAL_PATH:/opt/zyxhit-admin-files/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "系统管理"
      paths-to-match: "/**"
      packages-to-scan:
        - com.nova.auth.controller
        - com.nova.system.controller
        - com.nova.platform.file.controller
        - com.nova.platform.mail.controller
        - com.nova.platform.qrcode.controller
        - com.nova.platform.sms.controller
  default-flat-param-object: true

# 生产环境关闭 Knife4j 文档
knife4j:
  enable: true
  production: true
  setting:
    language: zh_cn
