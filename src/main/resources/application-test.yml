server:
  port: 8866

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hpwit_admin_boot_test?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true&allowMultiQueries=true
    username: root
    password: 123456

  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379
      password: 123456
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  cache:
    enabled: false
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: true
    caffeine:
      spec: initialCapacity=50,maximumSize=1000,expireAfterWrite=600s

  mail:
    host: smtp.163.com
    port: 465
    username: hpwitadmin@example.com
    password: your-mail-auth-code
    from: hpwitadmin@example.com
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: none
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true

oss:
  type: ${OSS_TYPE:local}
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: hpwit-admin-test
    custom-domain:
  aliyun:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: hpwit-admin-test
  tencent:
    region: ${COS_REGION:}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    bucket-name: ${COS_BUCKET_NAME:}
    custom-domain: ${COS_CUSTOM_DOMAIN:}
  local:
    storage-path: D:/hpwit-admin-files-test/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true

knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn

# ==================== 流程与AI ====================
hpwit:
  flowable:
    enabled: true
    schema-update: ${HPWIT_FLOWABLE_SCHEMA_UPDATE:false}
  agnet:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
      api-key: ${DEEPSEEK_API_KEY:}
